<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Personal Expense Calculator</h1>
        <p class="subtitle">Track your income, expenses and savings</p>

        <!-- Income -->
        <div class="card">
            <h2>Income Details</h2>

            <label for="income">Monthly Income (₹)</label>
            <input type="number" id="income" placeholder="Enter your income">
        </div>

        <!-- Expense -->
        <div class="card">
            <h2>Add Expense</h2>

            <label for="category">Expense Category</label>

            <select id="category">
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Others">Others</option>
            </select>

            <label for="amount">Expense Amount (₹)</label>
            <input type="number" id="amount" placeholder="Enter expense amount">

            <button onclick="addExpense()">Add Expense</button>
        </div>

        <!-- Expense List -->
        <div class="card">
            <h2>Expense List</h2>

            <div id="expenseList">
                <p class="empty">No expenses added yet.</p>
            </div>
        </div>

        <!-- Summary -->
        <div class="card summary">

            <h2>Summary Report</h2>

            <div class="summary-item">
                <span>Total Income</span>
                <strong id="totalIncome">₹0</strong>
            </div>

            <div class="summary-item">
                <span>Total Expenses</span>
                <strong id="totalExpenses">₹0</strong>
            </div>

            <div class="summary-item savings">
                <span>Savings</span>
                <strong id="savings">₹0</strong>
            </div>

            <h3>Category-wise Expenses</h3>

            <div class="category">
                <span>Food</span>
                <span id="foodTotal">₹0</span>
            </div>

            <div class="category">
                <span>Transport</span>
                <span id="transportTotal">₹0</span>
            </div>

            <div class="category">
                <span>Bills</span>
                <span id="billsTotal">₹0</span>
            </div>

            <div class="category">
                <span>Entertainment</span>
                <span id="entertainmentTotal">₹0</span>
            </div>

            <div class="category">
                <span>Others</span>
                <span id="othersTotal">₹0</span>
            </div>

        </div>

        <button class="clear-btn" onclick="clearAll()">
            Clear All
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
